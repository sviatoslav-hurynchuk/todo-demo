language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: false
  poem: false
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/node_modules/**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!*.db"
    - "!*.sqlite"

  path_instructions:
    - path: "**/*.cs"
      instructions: |
        - Review C# and .NET code for potential bugs, security flaws, performance bottlenecks, and adherence to 4-tier clean architecture principles.
        - Ensure EF Core best practices (proper indexing, no N+1 queries, AsNoTracking for reads).
        - Verify security: JWT token claims validation, BCrypt password hashing, and User Secrets usage.

    - path: "**/*.ts"
      instructions: |
        - Review TypeScript and Angular code for strict type safety, Reactive Forms, RxJS memory management, Auth Guards, and JWT Interceptors.

    - path: "**/*"
      instructions: |
        - Provide detailed, actionable line-by-line code review comments.
        - Focus strictly on potential bugs, security vulnerabilities, and code quality.
        - Ensure all suggested commit messages adhere strictly to Conventional Commits.

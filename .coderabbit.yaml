language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false

  path_filters:
    - "!**/node_modules/**"
    - "!**/bin/**"
    - "!**/obj/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!.angular/**"
    - "!.vs/**"
    - "!.idea/**"
    - "!package-lock.json"
    - "!*.db"
    - "!*.sqlite"

  path_instructions:
    - path: "backend/**/*.cs"
      instructions: |
        - Enforce strict 4-tier architecture boundaries:
          * Presentation (Api): REST controllers, routing, HTTP response formatting, JWT auth pipeline.
          * Application (Services): Business logic, DTO mappings, JWT generation, password hashing.
          * Abstractions (Interfaces): DTO contracts and service/repository interfaces.
          * Persistence (DataAccess): EF Core DbContext, IEntityTypeConfiguration classes, domain entities.
        - Ensure EF Core best practices: proper indexing, cascade delete rules, avoiding N+1 queries, and using AsNoTracking() for read-only queries.
        - Security: Verify JWT claims, BCrypt password hashing, and ensure no secrets are hardcoded in appsettings.json (use User Secrets / Env Vars).

    - path: "frontend/src/app/**/*.ts"
      instructions: |
        - Verify Angular best practices: strict TypeScript typing, Reactive Forms, RxJS memory leak prevention, Auth Guards, and JWT Interceptors.
        - Ensure clear separation of concerns between core services, feature modules (auth, tasks, categories), and shared UI components.

    - path: "**/*"
      instructions: |
        - Focus strictly on potential bugs, performance bottlenecks, security vulnerabilities, and type safety.
        - Keep review comments concise, direct, and actionable. Avoid nitpicking minor formatting or obvious code style.
        - Ensure all suggested commit messages adhere strictly to the Conventional Commits specification.

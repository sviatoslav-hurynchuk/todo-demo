<div class="date-picker-wrapper" [class.disabled]="isDisabled()">
  <!-- Input Bar Trigger -->
  <button
    type="button"
    class="date-picker-input"
    [class.active]="isOpen()"
    [class.has-value]="!!value()"
    [disabled]="isDisabled()"
    (click)="toggleOpen($event)"
    aria-label="Toggle calendar popup"
  >
    <span class="display-text">{{ getFormattedDisplay() || placeholder }}</span>
    <span class="calendar-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="16" y1="2" x2="16" y2="6"></line>
        <line x1="8" y1="2" x2="8" y2="6"></line>
        <line x1="3" y1="10" x2="21" y2="10"></line>
      </svg>
    </span>
  </button>

  <!-- Calendar Popover Dropdown -->
  @if (isOpen()) {
    <div class="calendar-popover" role="dialog" aria-label="Date Picker Calendar">
      <!-- Calendar Header -->
      <div class="calendar-header">
        <button
          type="button"
          class="nav-btn"
          (click)="prevMonth($event)"
          aria-label="Previous month"
        >
          ‹
        </button>
        <span class="month-year-label">{{ getCurrentMonthYearLabel() }}</span>
        <button
          type="button"
          class="nav-btn"
          (click)="nextMonth($event)"
          aria-label="Next month"
        >
          ›
        </button>
      </div>

      <!-- Days of Week Header -->
      <div class="days-header">
        @for (dayName of dayHeaders; track dayName) {
          <span class="day-name">{{ dayName }}</span>
        }
      </div>

      <!-- Calendar Days Grid -->
      <div class="days-grid">
        @for (day of getCalendarDays(); track day.dateString) {
          <button
            type="button"
            class="day-cell"
            [class.other-month]="!day.isCurrentMonth"
            [class.today]="day.isToday"
            [class.selected]="day.isSelected"
            (click)="selectDay(day, $event)"
          >
            {{ day.dayNumber }}
          </button>
        }
      </div>

      <!-- Footer Quick Action Buttons -->
      <div class="calendar-footer">
        <button
          type="button"
          class="footer-btn clear-btn"
          [disabled]="!value()"
          (click)="clearValue($event)"
        >
          Clear
        </button>
        <button
          type="button"
          class="footer-btn today-btn"
          (click)="selectToday($event)"
        >
          Today
        </button>
      </div>
    </div>
  }
</div>

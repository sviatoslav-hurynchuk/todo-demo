<header class="navbar">
  <div class="navbar-left">
    <button
      type="button"
      class="icon-btn mobile-menu-btn"
      aria-label="Toggle sidebar menu"
      (click)="onToggleSidebar()"
    >
      <span class="material-icons">menu</span>
    </button>

    <div class="brand">
      <span class="material-icons brand-icon">check_circle</span>
      <span class="brand-title">TodoApp</span>
    </div>
  </div>

  <div class="navbar-right">
    @if (authService.currentUser()) {
      <div class="user-info-wrapper">
        <button
          type="button"
          class="user-info"
          (click)="toggleProfilePopover($event)"
          aria-label="User profile info"
        >
          <span class="material-icons user-avatar">account_circle</span>
          <div class="user-details">
            <span class="username">{{ authService.currentUser()?.username }}</span>
            <span class="email">{{ authService.currentUser()?.email }}</span>
          </div>
        </button>

        @if (isProfilePopoverOpen()) {
          <div class="profile-popover" role="dialog" aria-label="User Details">
            <div class="popover-header">
              <span class="material-icons popover-avatar">account_circle</span>
              <div class="popover-user-details">
                <span class="popover-username">{{ authService.currentUser()?.username }}</span>
                <span class="popover-email">{{ authService.currentUser()?.email }}</span>
              </div>
            </div>
          </div>
        }
      </div>
    }

    <button
      type="button"
      class="btn-logout"
      aria-label="Sign out of account"
      (click)="logout()"
    >
      <span class="material-icons">logout</span>
      <span class="logout-text">Sign Out</span>
    </button>
  </div>
</header>

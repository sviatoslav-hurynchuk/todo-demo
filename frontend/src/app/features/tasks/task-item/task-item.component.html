<div class="task-card" [class.completed]="task.isCompleted" [class.important]="task.isImportant">
  <div class="checkbox-wrapper">
    <button
      type="button"
      class="checkbox-btn"
      [class.checked]="task.isCompleted"
      (click)="onToggleComplete($event)"
      [attr.aria-label]="task.isCompleted ? 'Mark task as incomplete' : 'Mark task as complete'"
    >
      @if (task.isCompleted) {
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      }
    </button>
  </div>

  <div class="task-content" (click)="onEdit($event)">
    <div class="task-title-row">
      <h3 class="task-title">{{ task.title }}</h3>
    </div>

    @if (task.description) {
      <p class="task-description">{{ task.description }}</p>
    }

    <div class="task-meta">
      @if (task.categoryName) {
        <span
          class="category-badge"
          [style.backgroundColor]="getCategoryColor() + '14'"
          [style.color]="getCategoryColor()"
          [style.borderColor]="getCategoryColor() + '33'"
        >
          <span class="category-bar" [style.backgroundColor]="getCategoryColor()"></span>
          {{ task.categoryName }}
        </span>
      }

      @if (getDueDateStatus(); as dueDateInfo) {
        <span class="due-badge" [ngClass]="dueDateInfo.statusClass">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          {{ dueDateInfo.text }}
        </span>
      }
    </div>
  </div>

  <div class="task-actions">
    <button
      type="button"
      class="action-btn star-btn"
      [class.active]="task.isImportant"
      (click)="onToggleImportant($event)"
      [attr.aria-label]="task.isImportant ? 'Remove from important' : 'Mark as important'"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" [attr.fill]="task.isImportant ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="2">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
    </button>

    <button
      type="button"
      class="action-btn edit-btn"
      (click)="onEdit($event)"
      aria-label="Edit task"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
    </button>

    <button
      type="button"
      class="action-btn delete-btn"
      (click)="onDelete($event)"
      aria-label="Delete task"
    >
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
    </button>
  </div>
</div>
